name: android

on:
  push:
    # House style (see launcher.yml): the feature area's long-lived branch
    # gets CI too, not just main.
    branches: [main, android, 'android-*']
    paths:
      - "crates/**"
      - "android/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "crates/**"
      - "android/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
          - i686-linux-android
    steps:
      - uses: actions/checkout@v4

      # The client tree (horizon-android depends on it) pulls ring via
      # ureq/rustls; ring's build script compiles C for the Android targets
      # even under `cargo check`, so the check legs need the NDK's clang.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and put its toolchain on PATH
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          NDK=$(sdkmanager --list | grep -oE 'ndk;[0-9.]+' | sort -V | tail -1)
          echo "Installing $NDK"
          yes | sdkmanager "$NDK" > /dev/null
          echo "$ANDROID_HOME/ndk/${NDK#ndk;}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo check
        run: cargo check -p horizon-android --target ${{ matrix.target }}

      - name: unit tests (host)
        if: matrix.target == 'aarch64-linux-android'
        run: cargo test -p horizon-android

  apk:
    name: APK (all ABIs)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The legacy 'tools' package no longer exists in the SDK repository and
      # setup-android installs it when given no inputs, so name a real one.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK + platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          NDK=$(sdkmanager --list | grep -oE 'ndk;[0-9.]+' | sort -V | tail -1)
          echo "Installing $NDK"
          yes | sdkmanager "$NDK" "platforms;android-37.2" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-libs

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native libraries
        run: ./scripts/build-android-libs.sh --profile dev

      - name: Build APK
        working-directory: android
        run: |
          # CI has no wrapper jar in the repo; let setup-android's gradle handle
          # it via the wrapper task, or use the local gradle.
          gradle wrapper --gradle-version 9.8.2
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: Release AAB (unsigned)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The legacy 'tools' package no longer exists in the SDK repository and
      # setup-android installs it when given no inputs, so name a real one.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK + platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          NDK=$(sdkmanager --list | grep -oE 'ndk;[0-9.]+' | sort -V | tail -1)
          yes | sdkmanager "$NDK" "platforms;android-37.2" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-libs

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native libraries (release)
        run: ./scripts/build-android-libs.sh --profile release

      - name: Build AAB
        working-directory: android
        run: |
          gradle wrapper --gradle-version 9.8.2
          ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
