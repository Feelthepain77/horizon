name: android

on:
  push:
    # House style (see launcher.yml): the feature area's long-lived branch
    # gets CI too, not just main.
    branches: [main, android, 'android-*']
    paths:
      - "crates/**"
      - "android/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      # The portable export is built from these too: a new pin or a changed
      # exporter source changes its tables.
      - "research-lock.json"
      - "mods/horizon/src/test/java/dev/horizonlab/parity/**"
  pull_request:
    paths:
      - "crates/**"
      - "android/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research-lock.json"
      - "mods/horizon/src/test/java/dev/horizonlab/parity/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # arm64-v8a only: every supported phone is aarch64; the other three
        # ABIs were bloat and got cut (2026-10). Re-adding one = one line here
        # + the cc-rs exports + build-android-libs.sh defaults.
        target:
          - aarch64-linux-android
    steps:
      - uses: actions/checkout@v4

      # The client tree (horizon-android depends on it) pulls ring via
      # ureq/rustls; ring's build script compiles C for the Android targets
      # even under `cargo check`, so the check legs need the NDK's clang.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and put its toolchain on PATH
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          NDK=$(sdkmanager --list | grep -oE 'ndk;[0-9.]+' | sort -V | tail -1)
          echo "Installing $NDK"
          yes | sdkmanager "$NDK" > /dev/null
          BIN="$ANDROID_HOME/ndk/${NDK#ndk;}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK toolchain bin: $BIN"
          ls "$BIN" | grep -E '(clang|ar)$' | head -20 || true
          echo "$BIN" >> "$GITHUB_PATH"
          # cc-rs (ring and friends) checks these before probing PATH. NDK r30
          # ships only API-suffixed wrappers (the bare <triple>-clang does not
          # exist), so point at the minSdk-35 one.
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android35-clang"   >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar"                         >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$BIN/llvm-ranlib"                 >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo check
        run: cargo check -p horizon-android --target ${{ matrix.target }}

      - name: unit tests (host)
        if: matrix.target == 'aarch64-linux-android'
        run: cargo test -p horizon-android

  portable-export:
    # The one-time portable export: the Java-25 exporter tables Android
    # cannot run (ART will not load Java-25 classes; targetSdk 29+ forbids a
    # JVM). The player imports the zip once next to the .minecraft they
    # already gave the app, and PLAY unlocks (the two paths compose into the
    # same prepared root; see crates/horizon-android/src/prepare.rs).
    #
    # The runner owns no .minecraft, so scripts/fetch-pinned-game-files.py
    # makes the minimal one from Mojang's public piston-meta/piston-data
    # endpoints, every file checked against research-lock.json — the same
    # checks the preparer re-applies on import. Nothing game-derived is ever
    # committed (.gitignore keeps .local/ and *.jar out; the pre-push hook
    # scans history), and the artifact is transient.
    name: Portable export
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # What research-lock.json pins (java_major); the exporters compile
          # and run with it.
          java-version: "25"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-export

      - name: Fetch the pinned game files from Mojang's public endpoints
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' research-lock.json | head -1)
          echo "version=$version" >> "$GITHUB_ENV"
          python3 scripts/fetch-pinned-game-files.py --out "$RUNNER_TEMP/minecraft"

      - name: Build horizon-prepare
        run: cargo build --release --locked -p horizon-prepare

      - name: Prepare the resources (the exporters run here)
        run: |
          target/release/horizon-prepare --prepare --root "$PWD" \
            --minecraft-dir "$RUNNER_TEMP/minecraft" \
            --server-jar "$RUNNER_TEMP/minecraft/server-$version.jar"

      - name: Pack the export (only what the phone cannot make)
        run: |
          set -euo pipefail
          # The phone's own prepare already extracted the client JAR's
          # assets/ and data/ and copied the real sounds, panorama, Unifont,
          # packs and languages from the player's asset store; the JAR's
          # placeholders in those paths must not overwrite them. Logs and the
          # compiled exporters' classes are build noise. Everything else —
          # the exporter tables, the datagen reports, the worldgen bundle —
          # is what the import brings.
          cd ".local/horizon-client"
          zip -qr9 "$RUNNER_TEMP/portable-export-$version.zip" "$version" \
            -x "$version/assets/*" "$version/data/*" \
            -x "$version/classes/*" "$version/client-classes/*" \
            -x "$version/*.log" "*.log"
          du -h "$RUNNER_TEMP/portable-export-$version.zip"

      - name: Verify the export against the Android client's requirements
        run: python3 scripts/verify-portable-export.py "$RUNNER_TEMP/portable-export-$version.zip"

      - name: Upload the portable export
        uses: actions/upload-artifact@v4
        with:
          name: horizon-portable-export-${{ env.version }}
          path: ${{ runner.temp }}/portable-export-${{ env.version }}.zip
          retention-days: 14
          if-no-files-found: error

  apk:
    name: APK (arm64-v8a)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The legacy 'tools' package no longer exists in the SDK repository and
      # setup-android installs it when given no inputs, so name a real one.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK + platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          NDK=$(sdkmanager --list | grep -oE 'ndk;[0-9.]+' | sort -V | tail -1)
          echo "Installing $NDK"
          yes | sdkmanager "$NDK" "platforms;android-37.2" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-libs

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native libraries
        run: ./scripts/build-android-libs.sh --profile dev

      - name: Build APK
        working-directory: android
        run: |
          # CI has no wrapper jar in the repo; let setup-android's gradle handle
          # it via the wrapper task, or use the local gradle.
          gradle wrapper --gradle-version 9.8.2
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: Release AAB (unsigned)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The legacy 'tools' package no longer exists in the SDK repository and
      # setup-android installs it when given no inputs, so name a real one.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK + platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          NDK=$(sdkmanager --list | grep -oE 'ndk;[0-9.]+' | sort -V | tail -1)
          yes | sdkmanager "$NDK" "platforms;android-37.2" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-libs

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native libraries (release)
        run: ./scripts/build-android-libs.sh --profile release

      - name: Build AAB
        working-directory: android
        run: |
          gradle wrapper --gradle-version 9.8.2
          ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
